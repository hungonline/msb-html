<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hành Tinh Số Doanh Nghiệp - MSB BUSINESS BANKING</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Khung bao toàn màn hình -->
  <main class="stage-wrapper">

    <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
    <div class="stage stage-home" id="screenStage">

      <!-- KHỐI TIÊU ĐỀ BÊN TRÁI -->
      <header class="brand-heading">
        <p class="sub-title">Hành tinh số doanh nghiệp</p>
        <div class="divider-line" aria-hidden="true"></div>
        <h1 class="main-title">
          <span>MSB</span>
          <span>BUSINESS</span>
          <span>BANKING</span>
        </h1>
        <p class="sub-title sub-title-bottom">Ngân hàng số vận hành cùng doanh nghiệp</p>
      </header>

      <!-- KHỐI 3 THẺ TÍNH NĂNG BÊN PHẢI -->
      <section class="features-container" aria-label="Các giải pháp tính năng doanh nghiệp">

        <!-- Thẻ 1: Tối ưu tài chính - Tối đa hiệu quả -->
        <a href="toi-uu.html" class="feature-card card-toiuu" tabindex="0">
          <div class="card-header">
            <img src="images/icon-finance.svg" alt="Tối ưu tài chính" class="card-icon">
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>TỐI ƯU</span></h2>
            <p class="card-desc">Tối ưu tài chính<br>Tối đa hiệu quả</p>
          </div>
        </a>

        <!-- Thẻ 2: Linh hoạt vận hành - Chủ động quản trị -->
        <a href="#" class="feature-card card-linhhoat" tabindex="0">
          <div class="card-header">
            <img src="images/icon-linhhoat.svg" alt="Linh hoạt vận hành" class="card-icon">
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>LINH HOẠT</span></h2>
            <p class="card-desc">Linh hoạt vận hành<br>Chủ động quản trị</p>
          </div>
        </a>

        <!-- Thẻ 3: Liền mạch - Hệ sinh thái kết nối All in One -->
        <a href="#" class="feature-card card-lienmach" tabindex="0">
          <div class="card-header">
            <img src="images/icon-ecosystem.svg" alt="Hệ sinh thái kết nối" class="card-icon">
          </div>
          <div class="card-body">
            <h2 class="card-title"><span>LIỀN MẠCH</span></h2>
            <p class="card-desc">Hệ sinh thái kết nối<br>All in One</p>
          </div>
        </a>

      </section>

    </div>

  </main>

</body>

</html>
