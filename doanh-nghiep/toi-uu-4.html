<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tối Ưu Tài Chính - Tối Đa Hiệu Quả - MSB Doanh Nghiệp</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Khung bao toàn màn hình -->
    <main class="stage-wrapper">

        <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
        <div class="stage stage-detail screen-2" id="screenStage">

            <!-- KHỐI TIÊU ĐỀ BÊN TRÊN Ở GIỮA -->
            <header class="detail-heading toiuu-heading left">
                <h1 class="main-title">
                    <span>CHỨNG CHỈ TIỀN GỬI</span>
                </h1>
                <p class="sub-desc">Tối ưu dòng tiền nhàn rỗi – Linh hoạt sử dụng</p>
            </header>

            <!-- KHỐI 5 THẺ TÍNH NĂNG Ở GIỮA -->
            <section class="toiuu-cards-container in-row" aria-label="Tối ưu tài chính - Tối đa hiệu quả">

                <!-- Thẻ 1: -->
                <article class="toiuu-card" tabindex="0">
                    <div class="rewards-card-num">1</div>
                    <div class="toiuu-card-body">
                        <h2 class="toiuu-card-title">
                            <span>Lãi suất hấp dẫn lên đến </span>
                            <span>7,5%/năm </span>
                        </h2>
                    </div>
                </article>

                <!-- Thẻ 2: -->
                <article class="toiuu-card" tabindex="0">
                    <div class="rewards-card-num">2</div>
                    <div class="toiuu-card-body">
                        <h2 class="toiuu-card-title">
                            <span>Hưởng lãi theo số ngày</span>
                            <span>nắm giữ</span>
                        </h2>
                    </div>
                </article>

                <!-- Thẻ 3: -->
                <article class="toiuu-card" tabindex="0">
                    <div class="rewards-card-num">3</div>
                    <div class="toiuu-card-body">
                        <h2 class="toiuu-card-title">
                            <span>Linh hoạt chuyển nhượng </span>
                        </h2>
                    </div>
                </article>

                <!-- Thẻ 4: -->
                <article class="toiuu-card" tabindex="0">
                    <div class="rewards-card-num">4</div>
                    <div class="toiuu-card-body">
                        <h2 class="toiuu-card-title">
                            <span>Thao tác 100% online</span>
                        </h2>
                    </div>
                </article>

            </section>


            <footer class="rewards-action-container">
                <div class="chevron-indicator" aria-hidden="true">
                    <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
                </div>
                <span class="rewards-action-label">TRẢI NGHIỆM NGAY</span>
                <div class="phone-mockup-wrapper">
                    <img src="images/phone_mockup.png" alt="Trải nghiệm ứng dụng MSB" class="img-phone-mockup">
                </div>
            </footer>

            <a href="javascript:;" class="btn-back right">
                <img src="images/icon-back2.png" alt="Back" class="img-back">
            </a>


        </div>

    </main>

</body>

</html>
