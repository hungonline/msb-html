<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Hệ Sinh Thái Tiện Ích - MSB</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Khung bao toàn màn hình -->
    <main class="stage-wrapper">

        <!-- Sân khấu hiển thị tỷ lệ chuẩn màn hình LED 1535x576 -->
        <div class="stage stage-marketplace" id="screenStage">

            <!-- KHỐI TIÊU ĐỀ BÊN TRÁI -->
            <header class="marketplace-heading">
                <h1 class="main-title">
                    <span>MARKETPLACE</span>
                </h1>
                <div class="divider-line" aria-hidden="true"></div>
                <p class="sub-title">
                    Hệ sinh thái tiện ích cho cuộc sống hiện đại
                </p>
                <div class="marketplace-info">
                    <img src="images/he-sinh-thai.png" alt="">
                </div>
            </header>

            <!-- KHỐI 4 THẺ TIỆN ÍCH BÊN PHẢI (GRID 2x2) -->
            <section class="marketplace-grid" aria-label="Hệ sinh thái tiện ích Marketplace">

                <!-- Thẻ 1 -->
                <article class="rewards-card card-marketplace-1" tabindex="0">
                    <div class="rewards-card-num">1</div>
                    <div class="rewards-card-body">
                        <p class="rewards-card-desc">
                            Mua sắm tiện lợi<br>
                            – ngay trên<br>
                            MSB Digital Bank
                        </p>
                    </div>
                </article>

                <!-- Thẻ 2 -->
                <article class="rewards-card card-marketplace-2" tabindex="0">
                    <div class="rewards-card-num">2</div>
                    <div class="rewards-card-body">
                        <p class="rewards-card-desc">
                            Nạp và thanh toán<br>
                            viễn thông<br>
                            nhanh chóng
                        </p>
                    </div>
                </article>

                <!-- Thẻ 3 -->
                <article class="rewards-card card-marketplace-3" tabindex="0">
                    <div class="rewards-card-num">3</div>
                    <div class="rewards-card-body">
                        <p class="rewards-card-desc">
                            Đặt dịch vụ<br>
                            du lịch<br>
                            thuận tiện
                        </p>
                    </div>
                </article>

                <!-- Thẻ 4 -->
                <article class="rewards-card card-marketplace-4" tabindex="0">
                    <div class="rewards-card-num">4</div>
                    <div class="rewards-card-body">
                        <p class="rewards-card-desc">
                            Tiếp cận dịch vụ<br>
                            bảo hiểm – tài chính<br>
                            dễ dàng
                        </p>
                    </div>
                </article>

            </section>

            <!-- KHỐI ĐIỀU HƯỚNG & MÔ HÌNH ĐIỆN THOẠI DƯỚI CÙNG -->
            <footer class="rewards-action-container">
                <div class="chevron-indicator" aria-hidden="true">
                    <img src="images/icon-chevron-down.svg" alt="" class="icon-down">
                </div>
                <span class="rewards-action-label">TRẢI NGHIỆM NGAY</span>
                <div class="phone-mockup-wrapper">
                    <img src="images/phone_mockup.png" alt="Trải nghiệm ứng dụng MSB" class="img-phone-mockup">
                </div>
            </footer>

            <a href="he-sinh-thai2.html" class="btn-back">
                <img src="images/icon-back2.png" alt="Quay lại" class="img-back">
            </a>

        </div>

    </main>

</body>

</html>
